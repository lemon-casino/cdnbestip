services:
  cdnbestip:
    image: ghcr.io/lemon-casino/cdnbestip:latest
    container_name: cdnbestip
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN before starting}"
      CDNBESTIP_URL: "${CDNBESTIP_SPEED_URL:-}"
      TZ: Asia/Shanghai
    command:
      - cdnbestip
      - --ip-url
      - all
      - --domain
      - lemon.vin
      - --prefix
      - cdst
      - --speed
      - "10"
      - --port
      - "443"
      - --dns
      - --quantity
      - "10"
      - --schedule
      - "60"
    volumes:
      - cdnbestip-data:/app
      - cdnbestip-cache:/root/.cdnbestip

volumes:
  cdnbestip-data:
  cdnbestip-cache:
